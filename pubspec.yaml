name: savedeck_toolkit
description: "SaveDeck 游戏库管理与 ScreenScraper 搜刮工具"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.0-0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^0.13.5
  path: ^1.8.0
  path_provider: ^2.0.11
  shared_preferences: ^2.0.15
  permission_handler: ^9.0.0
  crypto: ^3.0.2
  uuid: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/screenscraper_systems.json
